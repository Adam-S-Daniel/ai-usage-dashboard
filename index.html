<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-LY5W9vbDIjMuytQldQ2RE65Gqbj/9XOs3RUczFFY1T8='; connect-src https://api.github.com https://gist.githubusercontent.com; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Usage">
<meta name="robots" content="noindex">
<title>AI Usage</title>
<style>
:root{
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
  --track:#ecebe6;--used:#2a78d6;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#4a3aa7;
  --good:#006300;--warn:#8a5a00;--crit:#d03b3b;
}
@media (prefers-color-scheme:dark){:root{
  --page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;
  --track:#2c2c2a;--used:#3987e5;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9;
  --good:#0ca30c;--warn:#fab219;--crit:#e66767;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 2px}
.sub{color:var(--ink2);font-size:13px}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:8px 14px;min-height:40px}
button:active{opacity:.6}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:14px;margin-bottom:12px}
.banner{border-color:var(--warn)}
.meter{margin-top:14px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{position:relative;height:14px;background:var(--track);border-radius:4px;margin:6px 0 4px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--used);border-radius:4px;min-width:2px}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.pace{font-size:13px;font-weight:600}
.good{color:var(--good)}.warn{color:var(--warn)}.crit{color:var(--crit)}
.key{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:10px;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sw.line{width:2px;height:12px;background:var(--ink);border-radius:0}
svg{display:block;width:100%;height:auto;margin-top:10px}
svg text{fill:var(--muted);font-size:17px}
#detail{font-size:13px;color:var(--ink2);min-height:20px;margin-top:6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:10px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink2);font-weight:500}
code{font-size:13px;word-break:break-all}
</style>
</head>
<body>
<main>
<header>
  <div><h1>AI Usage</h1><div class="sub" id="updated">Loading…</div></div>
  <button id="refresh">Refresh</button>
</header>
<div id="app"></div>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtTok = (n) => n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
const fmtUsd = (n) => "$" + n.toFixed(2);
const STALE_MIN = 12;
let data = null, err = null, choice = null; // choice: fragment (id or id.key) awaiting the user's decision

function dur(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60);
  return h < 48 ? h + " h " + (m % 60) + " min" : Math.floor(h / 24) + " d " + (h % 24) + " h";
}

// Pure: derive elapsed share of the period and pace from one limit window.
function windowStats(w, now) {
  const used = Math.max(0, Math.min(100, w.used_pct));
  if (!w.resets_at) return { used, elapsed: null };
  const left = new Date(w.resets_at).getTime() - now;
  if (left <= 0) return { used, elapsed: null, expired: true };
  const elapsed = Math.max(0, Math.min(100, (1 - left / (w.period_seconds * 1000)) * 100));
  const projected = elapsed >= 5 ? (used / elapsed) * 100 : null;
  return { used, elapsed, left, diff: used - elapsed, projected };
}

function meter(w, now) {
  const s = windowStats(w, now);
  let pace = "", sub = "";
  if (s.expired) sub = "Window has reset; waiting for new data";
  else if (s.elapsed === null) sub = "No active window";
  else {
    sub = `${s.elapsed.toFixed(0)}% of period elapsed · resets in ${dur(s.left)}`;
    const d = Math.round(s.diff);
    const cls = s.used >= 90 || (s.projected && s.projected >= 100) ? "crit" : d > 0 ? "warn" : "good";
    const icon = cls === "good" ? "✓" : cls === "warn" ? "▲" : "●";
    const txt = d > 0 ? `${d} pts ahead of pace` : d < 0 ? `${-d} pts under pace` : "On pace";
    const proj = s.projected && s.projected >= 100 ? " · on track to hit the limit" : "";
    pace = `<span class="pace ${cls}">${icon} ${txt}${proj}</span>`;
  }
  const tick = s.elapsed === null ? "" : `<div class="tick" style="left:calc(${s.elapsed}% - 1px)"></div>`;
  return `<div class="meter"><div class="row"><span>${esc(w.label)}</span><span class="big">${s.used.toFixed(0)}%</span></div>
    <div class="bar" role="img" aria-label="${s.used.toFixed(0)}% used"><div class="fill" style="width:${s.used}%"></div>${tick}</div>
    <div class="row sub"><span>${sub}</span>${pace}</div></div>`;
}

function srcNote(src) {
  if (!src) return `<div class="sub">No data yet.</div>`;
  if (src.ok) return "";
  const when = src.fetched_at ? ` · Showing data from ${new Date(src.fetched_at).toLocaleString()}.` : "";
  return `<div class="sub warn">▲ ${esc(src.error)}${when}</div>`;
}

function limitCard(title, src, now) {
  const plan = src && src.plan ? ` <span class="sub">${esc(src.plan)}</span>` : "";
  const meters = src && src.windows ? src.windows.map((w) => meter(w, now)).join("") : "";
  const key = meters ? `<div class="key"><span><span class="sw" style="background:var(--used)"></span>Used</span><span><span class="sw line"></span>Period elapsed</span></div>` : "";
  return `<section class="card"><h2>${title}${plan}</h2>${srcNote(src)}${meters}${key}</section>`;
}

function platformCard(src) {
  let body = "";
  if (src && src.usage) {
    const models = {};
    const add = (m) => (models[m] ||= { input: 0, cache_write: 0, cache_read: 0, output: 0, usd: 0 });
    src.usage.forEach((r) => { const m = add(r.model); for (const k of ["input", "cache_write", "cache_read", "output"]) m[k] += r[k]; });
    (src.costs || []).forEach((c) => (add(c.model).usd += c.usd));
    const names = Object.keys(models).sort((a, b) => models[b].usd - models[a].usd || models[b].output - models[a].output);
    const total = names.reduce((t, n) => t + models[n].usd, 0);
    // Color follows the model (top 5 by cost, rest folded into Other).
    const top = names.filter((n) => models[n].usd > 0).slice(0, 5);
    const slot = (n) => (top.includes(n) ? top.indexOf(n) : 5);
    const days = {};
    (src.costs || []).forEach((c) => { const d = (days[c.date] ||= [0, 0, 0, 0, 0, 0]); d[slot(c.model)] += c.usd; });
    const dates = Object.keys(days).sort();
    const today = new Date().toISOString().slice(0, 10);
    body += `<div class="row" style="margin-top:8px"><span class="sub">Cost, last ${dates.length || 0} days with spend</span><span class="big">${fmtUsd(total)}</span></div>`;
    if (dates.length) {
      const first = new Date(dates[0] + "T00:00:00Z"), n = Math.round((new Date(today + "T00:00:00Z") - first) / 864e5) + 1;
      const all = Array.from({ length: Math.max(n, 1) }, (_, i) => new Date(first.getTime() + i * 864e5).toISOString().slice(0, 10));
      const max = Math.max(...all.map((d) => (days[d] || []).reduce((a, b) => a + b, 0)), 0.01);
      const W = 640, H = 190, L = 52, B = 22, step = (W - L) / all.length, bw = Math.max(2, Math.min(24, step - 2));
      let g = "";
      for (const f of [0, 0.5, 1]) { const y = (H - B) * (1 - f) + 4; g += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L - 4}" y="${y + 6}" text-anchor="end">$${(max * f).toFixed(max < 10 ? 2 : 0)}</text>`; }
      all.forEach((d, i) => {
        const x = L + i * step + (step - bw) / 2; let y = H - B + 4;
        (days[d] || []).forEach((v, k) => { if (v <= 0) return; const h = Math.max(1, (v / max) * (H - B)); y -= h; g += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1, h - 2)}" rx="2" fill="var(--s${k + 1})"/>`; });
        g += `<rect class="hit" data-d="${esc(d)}" x="${L + i * step}" y="0" width="${step}" height="${H}" fill="transparent"/>`;
      });
      g += `<text x="${L}" y="${H + 4}">${esc(dates[0].slice(5))}</text><text x="${W}" y="${H + 4}" text-anchor="end">${esc(today.slice(5))}</text>`;
      body += `<svg viewBox="0 -12 ${W} ${H + 18}" role="img" aria-label="Daily cost by model">${g}</svg><div id="detail">Tap a day for its breakdown.</div>`;
      const legend = top.concat(names.some((n) => !top.includes(n) && models[n].usd > 0) ? ["Other"] : []);
      body += `<div class="key">${legend.map((n) => `<span><span class="sw" style="background:var(--s${n === "Other" ? 6 : top.indexOf(n) + 1})"></span>${esc(n)}</span>`).join("")}</div>`;
      platformCard.days = days; platformCard.legend = [...top, "", "", "", "", ""].slice(0, 5).concat("Other");
    }
    body += `<div class="scroll"><table><tr><th>Model</th><th>Input</th><th>Cache write</th><th>Cache read</th><th>Output</th><th>Cost</th></tr>` +
      names.map((n) => { const m = models[n]; return `<tr><td>${esc(n)}</td><td>${fmtTok(m.input)}</td><td>${fmtTok(m.cache_write)}</td><td>${fmtTok(m.cache_read)}</td><td>${fmtTok(m.output)}</td><td>${fmtUsd(m.usd)}</td></tr>`; }).join("") +
      (names.length ? "" : `<tr><td colspan="6">No API usage in this period.</td></tr>`) + `</table></div>`;
  }
  return `<section class="card"><h2>Claude platform (API)</h2>${srcNote(src)}${body}</section>`;
}

function render() {
  const app = $("#app"), now = Date.now();
  if (!gistId() && !isDemo()) {
    $("#updated").textContent = "Not set up";
    app.innerHTML = `<section class="card"><h2>Setup</h2><p class="sub">Run <code>collector/Install.ps1</code> on your laptop, then open the link it prints (this page with <code>#&lt;gist id&gt;.&lt;key&gt;</code> at the end). The id and key are remembered on this device. Add <code>#demo</code> to preview with sample data.</p></section>`;
    return;
  }
  if (choice) {
    $("#updated").textContent = "Choose a data source";
    app.innerHTML = `<section class="card banner"><h2>Different data source</h2><p class="sub">This link points at a different data source (<code>${esc(idOf(choice))}</code>) than the one saved on this device (<code>${esc(idOf(saved()))}</code>). Only use the new link if you trust where it came from.</p><div class="row"><button id="keep">Keep the saved one</button><button id="adopt">Use the new link</button></div></section>`;
    $("#adopt").addEventListener("click", () => load(choice));
    $("#keep").addEventListener("click", () => { history.replaceState(null, "", location.pathname + location.search); load(); });
    return;
  }
  if (!data) { app.innerHTML = err ? `<section class="card banner"><h2>Could not load data</h2><div class="sub">${esc(err)}</div></section>` : ""; if (err) $("#updated").textContent = "Error"; return; }
  const age = now - new Date(data.generated_at).getTime(), stale = age > STALE_MIN * 60000;
  $("#updated").textContent = `Collected ${dur(age)} ago` + (data.host ? ` on ${data.host}` : "");
  const s = data.sources || {};
  app.innerHTML =
    (err ? `<section class="card banner"><div class="sub warn">▲ Refresh failed: ${esc(err)}</div></section>` : "") +
    (stale ? `<section class="card banner"><div class="sub warn">▲ No update in ${dur(age)}. The laptop may be asleep or offline.</div></section>` : "") +
    limitCard("Claude", s.claude, now) + limitCard("ChatGPT (Codex limits)", s.codex, now) + platformCard(s.platform);
}

document.addEventListener("click", (e) => {
  const d = e.target.dataset && e.target.dataset.d;
  if (!d) return;
  const v = (platformCard.days || {})[d] || [];
  const parts = v.map((x, k) => (x > 0 ? `${platformCard.legend[k]} ${fmtUsd(x)}` : "")).filter(Boolean);
  $("#detail").textContent = `${d}: ` + (parts.length ? `${fmtUsd(v.reduce((a, b) => a + b, 0))} (${parts.join(", ")})` : "no spend");
});

const isDemo = () => location.hash === "#demo";
// A reference is "<gist id>" (legacy, plaintext data) or "<gist id>.<key>" (encrypted data); the key never leaves the URL fragment.
const REF = /^([0-9a-f]{20,40})(?:\.([A-Za-z0-9_-]{43}))?$/i;
const fragId = () => { const h = location.hash.slice(1); return REF.test(h) ? h : null; };
const idOf = (ref) => String(ref).split(".")[0];
function saved() { try { return localStorage.getItem("gist"); } catch { return null; } }
const gistId = () => fragId() || saved();

// Decrypts the gist file text. A key demands encrypted data and no key demands plaintext: no downgrade.
async function open(text, key) {
  const doc = JSON.parse(text);
  const enc = doc !== null && typeof doc === "object" && doc.v === 1 && doc.enc === "A256GCM";
  if (!key) {
    if (enc) throw new Error("This data is encrypted. Open the full link Install.ps1 printed (it ends with .<key>).");
    return validateUsage(doc);
  }
  if (!enc) throw new Error("Expected encrypted data but the gist is not encrypted.");
  let plain;
  try {
    const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
    const iv = b64(doc.iv);
    if (iv.length !== 12) throw 0;
    const k = await crypto.subtle.importKey("raw", b64(key), "AES-GCM", false, ["decrypt"]);
    plain = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, k, b64(doc.ct)));
  } catch { throw new Error("Could not decrypt usage.json: the link's key does not match."); }
  return validateUsage(JSON.parse(plain));
}

// Reject, never coerce: the page renders only a document that passed this.
function validateUsage(doc) {
  const bad = (p) => { throw new Error("usage.json is malformed: " + p); };
  const obj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
  const num = (v) => typeof v === "number" && isFinite(v);
  const str = (v) => typeof v === "string";
  const when = (v) => str(v) && isFinite(Date.parse(v));
  // Within 400 days before / 2 days after generation: bounds the chart's day loop.
  const day = (v) => { const t = str(v) && /^\d{4}-\d{2}-\d{2}$/.test(v) ? Date.parse(v + "T00:00:00Z") : NaN; const g = Date.parse(doc.generated_at); return t >= g - 400 * 864e5 && t <= g + 2 * 864e5; };
  const need = (ok, p) => { if (!ok) bad(p); };
  const opt = (v, ok, p) => { if (v != null) need(ok(v), p); };
  const list = (v, p, row) => { if (v == null) return; need(Array.isArray(v), p); v.forEach((x, i) => { need(obj(x), `${p}[${i}]`); row(x, `${p}[${i}]`); }); };
  need(obj(doc), "(document)");
  need(when(doc.generated_at), "generated_at");
  opt(doc.host, str, "host");
  need(obj(doc.sources), "sources");
  const src = (name, body) => {
    const s = doc.sources[name], p = "sources." + name;
    if (s == null) return;
    need(obj(s), p);
    need(typeof s.ok === "boolean", p + ".ok");
    opt(s.error, str, p + ".error");
    opt(s.fetched_at, when, p + ".fetched_at");
    body(s, p);
  };
  for (const name of ["claude", "codex"]) src(name, (s, p) => {
    opt(s.plan, str, p + ".plan");
    list(s.windows, p + ".windows", (w, q) => {
      need(str(w.label), q + ".label");
      need(num(w.used_pct), q + ".used_pct");
      opt(w.resets_at, when, q + ".resets_at");
      need(num(w.period_seconds) && w.period_seconds > 0, q + ".period_seconds");
    });
  });
  src("platform", (s, p) => {
    list(s.usage, p + ".usage", (r, q) => {
      need(day(r.date), q + ".date");
      need(str(r.model), q + ".model");
      for (const k of ["input", "cache_write", "cache_read", "output"]) need(num(r[k]) && r[k] >= 0, `${q}.${k}`);
    });
    list(s.costs, p + ".costs", (c, q) => {
      need(day(c.date), q + ".date");
      need(str(c.model), q + ".model");
      need(num(c.usd), q + ".usd");
    });
  });
  return doc;
}

function demo() {
  const iso = (ms) => new Date(Date.now() + ms).toISOString(), H = 36e5;
  const day = (i) => new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
  const costs = [], usage = [];
  for (let i = 13; i >= 0; i--) {
    costs.push({ date: day(i), model: "sample-model-large", usd: 1 + ((i * 7) % 5) }, { date: day(i), model: "sample-model-small", usd: 0.2 + ((i * 3) % 4) / 4 });
    usage.push({ date: day(i), model: "sample-model-large", input: 40000, cache_write: 90000, cache_read: 1200000, output: 30000 }, { date: day(i), model: "sample-model-small", input: 150000, cache_write: 0, cache_read: 0, output: 60000 });
  }
  return { generated_at: iso(-12e4), host: "sample data", sources: {
    claude: { ok: true, plan: "max", windows: [
      { label: "Session (5 h)", used_pct: 62, resets_at: iso(2.6 * H), period_seconds: 18000 },
      { label: "Week, all models", used_pct: 31, resets_at: iso(74 * H), period_seconds: 604800 },
      { label: "Week, Opus", used_pct: 71, resets_at: iso(74 * H), period_seconds: 604800 }] },
    codex: { ok: false, error: "Sample of a failed fetch", fetched_at: iso(-3 * H), plan: "plus", windows: [
      { label: "Session (5 h)", used_pct: 8, resets_at: iso(1 * H), period_seconds: 18000 },
      { label: "Week", used_pct: 96, resets_at: iso(20 * H), period_seconds: 604800 }] },
    platform: { ok: true, usage, costs } } };
}

async function load(adopt) {
  if (isDemo()) { data = validateUsage(demo()); err = null; return render(); }
  // A fragment id is only a candidate: it is saved after its gist loaded and validated.
  const frag = fragId(), old = saved();
  if (frag && old && frag !== old && adopt !== frag) { choice = frag; return render(); }
  choice = null;
  const ref = frag || old;
  if (!ref) return render();
  const [id, key] = ref.split(".");
  $("#refresh").disabled = true;
  try {
    const r = await fetch("https://api.github.com/gists/" + id, { cache: "no-store", headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error(r.status === 403 ? "GitHub rate limit reached; try again in a few minutes" : "GitHub returned " + r.status);
    const f = (await r.json()).files["usage.json"];
    if (!f) throw new Error("usage.json is not in the gist yet");
    const text = f.truncated ? await (await fetch(f.raw_url, { cache: "no-store" })).text() : f.content;
    data = await open(text, key); err = null;
    if (frag && frag !== old) try { localStorage.setItem("gist", frag); } catch {}
  } catch (e) { err = e.message; }
  $("#refresh").disabled = false;
  render();
}

$("#refresh").addEventListener("click", load);
addEventListener("hashchange", load);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 120000);   // re-read the gist every 2 min
setInterval(() => { if (!document.hidden && data) render(); }, 30000); // keep elapsed time moving
load();
</script>
</body>
</html>
