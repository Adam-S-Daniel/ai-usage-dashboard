<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-OZLxWmAncK3HH0bcDfSppvo2KWqiJ8IPctpLDvZFddw='; connect-src https://api.github.com https://gist.githubusercontent.com; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Usage">
<meta name="robots" content="noindex">
<title>AI Usage</title>
<style>
:root{
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
  --track:#ecebe6;--used:#2a78d6;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#4a3aa7;
  --good:#006300;--warn:#8a5a00;--crit:#d03b3b;
}
@media (prefers-color-scheme:dark){:root{
  --page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;
  --track:#2c2c2a;--used:#3987e5;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9;
  --good:#0ca30c;--warn:#fab219;--crit:#e66767;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 2px}
.sub{color:var(--ink2);font-size:13px}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:8px 14px;min-height:40px}
button:active{opacity:.6}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:14px;margin-bottom:12px}
.banner{border-color:var(--warn)}
.meter{margin-top:14px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{position:relative;height:14px;background:var(--track);border-radius:4px;margin:6px 0 4px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--used);border-radius:4px;min-width:2px}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.pace{font-size:13px;font-weight:600}
.good{color:var(--good)}.warn{color:var(--warn)}.crit{color:var(--crit)}
.key{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:10px;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sw.line{width:2px;height:12px;background:var(--ink);border-radius:0}
svg{display:block;width:100%;height:auto;margin-top:10px}
svg text{fill:var(--muted);font-size:17px}
#detail{font-size:13px;color:var(--ink2);min-height:20px;margin-top:6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:10px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink2);font-weight:500}
code{font-size:13px;word-break:break-all}
.other{margin-top:14px;border-top:1px solid var(--grid);padding-top:8px}
.other .bar{height:8px}
.tick.stop{background:var(--crit)}
.sec{margin-top:14px;border-top:1px solid var(--grid);padding-top:8px}
details.calc{margin-top:10px;font-size:13px;color:var(--ink2)}
details.calc summary{cursor:pointer;color:var(--ink);font-weight:500}
details.calc ol{margin:8px 0 0;padding-left:20px}
details.calc li{margin:6px 0;line-height:1.45}
details.calc b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
<header>
  <div><h1>AI Usage</h1><div class="sub" id="updated">Loading…</div></div>
  <button id="refresh">Refresh</button>
</header>
<div id="app"></div>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// A count that rounds up to 1000 of its unit moves to the next unit, so it never reads "1000.0k".
const fmtTok = (n) => {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) { const m = (n / 1e6).toFixed(1); return m === "1000.0" ? "1.00B" : m + "M"; }
  if (n >= 1e3) { const k = (n / 1e3).toFixed(1); return k === "1000.0" ? "1.0M" : k + "k"; }
  return String(n);
};
const fmtUsd = (n) => "$" + n.toFixed(2);
const STALE_MIN = 12, DAY = 864e5, MAX_DAYS = 400;
// Size caps: a valid gist must not be able to make the page build megabytes of markup.
// MAX_ROWS is 400 days x 25 models: the collector aggregates to one row per (date, model) per list and refuses to
// publish more than MAX_ROWS, so what it publishes (at most 300 days) always passes. MAX_TEXT is the real size limit.
// The gist API response also lists up to thousands of revisions (the collector writes every 5 minutes), hence MAX_API.
const MAX_TEXT = 4e6, MAX_API = 1e7, MAX_ROWS = 10000, MAX_WINDOWS = 20, MAX_OTHER = 40, MAX_MODELS = 300, MAX_STR = 200, MAX_ERR = 1000, MAX_NUM = 1e15;
let data = null, lastRef = null, adopted = null, err = null, choice = null, seq = 0; // choice: fragment (id or id.key) awaiting the user's decision

function dur(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60);
  return h < 48 ? h + " h " + (m % 60) + " min" : Math.floor(h / 24) + " d " + (h % 24) + " h";
}

// Pure: derive elapsed share of the period and pace from one limit window.
function windowStats(w, now) {
  const used = Math.max(0, Math.min(100, w.used_pct));
  if (!w.resets_at) return { used, elapsed: null };
  const left = new Date(w.resets_at).getTime() - now;
  if (left <= 0) return { used, elapsed: null, expired: true };
  const elapsed = Math.max(0, Math.min(100, (1 - left / (w.period_seconds * 1000)) * 100));
  const projected = elapsed >= 5 ? (used / elapsed) * 100 : null;
  return { used, elapsed, left, diff: used - elapsed, projected };
}

function meter(w, now) {
  const s = windowStats(w, now);
  let pace = "", sub = "";
  if (s.expired) sub = "Window has reset; waiting for new data";
  else if (s.elapsed === null) sub = "No active window";
  else {
    // paced_from: the collector shortened the period to start at a manual reset (config.json claudePaceFrom).
    const from = w.paced_from ? ` since reset ${new Date(w.paced_from).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })}` : "";
    sub = `${s.elapsed.toFixed(0)}% of period elapsed${from} · resets in ${dur(s.left)}`;
    const d = Math.round(s.diff);
    const cls = s.used >= 90 || (s.projected && s.projected >= 100) ? "crit" : d > 0 ? "warn" : "good";
    const icon = cls === "good" ? "✓" : cls === "warn" ? "▲" : "●";
    const txt = d > 0 ? `${d} pts ahead of pace` : d < 0 ? `${-d} pts under pace` : "On pace";
    const proj = s.projected && s.projected >= 100 ? " · on track to hit the limit" : "";
    pace = `<span class="pace ${cls}">${icon} ${txt}${proj}</span>`;
  }
  const tick = s.elapsed === null ? "" : `<div class="tick" style="left:calc(${s.elapsed}% - 1px)"></div>`;
  return `<div class="meter"><div class="row"><span>${esc(w.label)}</span><span class="big">${s.used.toFixed(0)}%</span></div>
    <div class="bar" role="img" aria-label="${s.used.toFixed(0)}% used"><div class="fill" style="width:${s.used}%"></div>${tick}</div>
    <div class="row sub"><span>${sub}</span>${pace}</div></div>`;
}

// Informational only: limits the API reports under internal codenames. No period is known, so no pace or elapsed marker.
function otherLimit(o, now) {
  const used = Math.max(0, Math.min(100, o.used_pct));
  const reset = !o.resets_at ? "No active window" : new Date(o.resets_at).getTime() <= now ? "Window has reset" : `resets in ${dur(new Date(o.resets_at).getTime() - now)}`;
  const usd = o.used_usd != null && o.limit_usd != null ? ` · ${fmtUsd(o.used_usd)} of ${fmtUsd(o.limit_usd)}${o.remaining_usd != null ? ` (${fmtUsd(o.remaining_usd)} left)` : ""}` : "";
  const lock = o.locked_reason != null ? ` · ${esc(o.locked_reason)}` : "";
  return `<div class="meter"><div class="row"><code>${esc(o.label)}</code><span class="big">${used.toFixed(0)}%</span></div>
    <div class="bar" role="img" aria-label="${used.toFixed(0)}% used"><div class="fill" style="width:${used}%"></div></div>
    <div class="sub">${reset}${usd}${lock}</div></div>`;
}

function srcNote(src) {
  if (!src) return `<div class="sub">No data yet.</div>`;
  if (src.ok) return "";
  const when = src.fetched_at ? ` · Showing data from ${new Date(src.fetched_at).toLocaleString()}.` : "";
  return `<div class="sub warn">▲ ${esc(src.error)}${when}</div>`;
}

function limitCard(title, src, now, other) {
  const plan = src && src.plan ? ` <span class="sub">${esc(src.plan)}</span>` : "";
  const meters = src && src.windows ? src.windows.map((w) => meter(w, now)).join("") : "";
  const key = meters ? `<div class="key"><span><span class="sw" style="background:var(--used)"></span>Used</span><span><span class="sw line"></span>Period elapsed</span></div>` : "";
  const extra = other && src && src.other && src.other.length ? `<div class="other"><div class="sub">Other limits (codenames)</div>${src.other.map((o) => otherLimit(o, now)).join("")}</div>` : "";
  return `<section class="card"><h2>${title}${plan}</h2>${srcNote(src)}${meters}${key}${extra}</section>`;
}

function platformCard(src) {
  let body = "";
  if (src && src.usage) {
    const models = Object.create(null); // keyed by gist-supplied strings: no prototype to hit
    const add = (m) => (models[m] ||= { input: 0, cache_write: 0, cache_read: 0, output: 0, usd: 0 });
    src.usage.forEach((r) => { const m = add(r.model); for (const k of ["input", "cache_write", "cache_read", "output"]) m[k] += r[k]; });
    (src.costs || []).forEach((c) => (add(c.model).usd += c.usd));
    const names = Object.keys(models).sort((a, b) => models[b].usd - models[a].usd || models[b].output - models[a].output);
    const total = names.reduce((t, n) => t + models[n].usd, 0);
    // Color follows the model (top 5 by cost, rest folded into Other).
    const top = names.filter((n) => models[n].usd > 0).slice(0, 5);
    const slot = (n) => (top.includes(n) ? top.indexOf(n) : 5);
    const days = Object.create(null);
    (src.costs || []).forEach((c) => { const d = (days[c.date] ||= [0, 0, 0, 0, 0, 0]); d[slot(c.model)] += c.usd; });
    const dates = Object.keys(days).sort();
    const today = new Date().toISOString().slice(0, 10);
    body += `<div class="row" style="margin-top:8px"><span class="sub">Cost, last ${dates.length || 0} days with spend</span><span class="big">${fmtUsd(total)}</span></div>`;
    if (dates.length) {
      // At most MAX_DAYS days ending today (or the latest dated row), whatever the data says.
      const t0 = Date.parse(dates[0] + "T00:00:00Z"), t1 = Math.max(Date.parse(today + "T00:00:00Z"), Date.parse(dates[dates.length - 1] + "T00:00:00Z"));
      const n = Math.min(MAX_DAYS, Math.round((t1 - t0) / DAY) + 1) || 1, start = t1 - (n - 1) * DAY;
      const all = Array.from({ length: n }, (_, i) => new Date(start + i * DAY).toISOString().slice(0, 10));
      const max = all.reduce((m, d) => Math.max(m, (days[d] || []).reduce((a, b) => a + b, 0)), 0.01);
      const W = 640, H = 190, L = 52, B = 22, step = (W - L) / all.length, bw = Math.max(2, Math.min(24, step - 2));
      let g = "";
      for (const f of [0, 0.5, 1]) { const y = (H - B) * (1 - f) + 4; g += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L - 4}" y="${y + 6}" text-anchor="end">$${(max * f).toFixed(max < 10 ? 2 : 0)}</text>`; }
      all.forEach((d, i) => {
        const x = L + i * step + (step - bw) / 2; let y = H - B + 4;
        (days[d] || []).forEach((v, k) => { if (v <= 0) return; const h = Math.max(1, (v / max) * (H - B)); y -= h; g += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1, h - 2)}" rx="2" fill="var(--s${k + 1})"/>`; });
        g += `<rect class="hit" data-d="${esc(d)}" x="${L + i * step}" y="0" width="${step}" height="${H}" fill="transparent"/>`;
      });
      g += `<text x="${L}" y="${H + 4}">${esc(all[0].slice(5))}</text><text x="${W}" y="${H + 4}" text-anchor="end">${esc(all[all.length - 1].slice(5))}</text>`;
      body += `<svg viewBox="0 -12 ${W} ${H + 18}" role="img" aria-label="Daily cost by model">${g}</svg><div id="detail">Tap a day for its breakdown.</div>`;
      const legend = top.concat(names.some((n) => !top.includes(n) && models[n].usd > 0) ? ["Other"] : []);
      body += `<div class="key">${legend.map((n) => `<span><span class="sw" style="background:var(--s${n === "Other" ? 6 : top.indexOf(n) + 1})"></span>${esc(n)}</span>`).join("")}</div>`;
      platformCard.days = days; platformCard.legend = [...top, "", "", "", "", ""].slice(0, 5).concat("Other");
    }
    body += `<div class="scroll"><table><tr><th>Model</th><th>Input</th><th>Cache write</th><th>Cache read</th><th>Output</th><th>Cost</th></tr>` +
      names.map((n) => { const m = models[n]; return `<tr><td>${esc(n)}</td><td>${fmtTok(m.input)}</td><td>${fmtTok(m.cache_write)}</td><td>${fmtTok(m.cache_read)}</td><td>${fmtTok(m.output)}</td><td>${fmtUsd(m.usd)}</td></tr>`; }).join("") +
      (names.length ? "" : `<tr><td colspan="6">No API usage in this period.</td></tr>`) + `</table></div>`;
  }
  return `<section class="card"><h2>Claude platform (API)</h2>${srcNote(src)}${body}</section>`;
}

// Loop guards: the self-improvement loop's allowance guard, as printed by the collector's loopStatus command (schema 1).
// Allowance points are approximate, so the text says so. Every value is validated before it gets here.
const VERDICTS = { open: ["Open", "good"], refresh: ["One run allowed", "warn"], pace_probe: ["One run allowed", "warn"], pace_hold: ["Paused: ahead of pace", "crit"], session_hold: ["Paused: 5-hour limit", "crit"], cap_full: ["Paused: weekly share used", "crit"], error: ["Guard could not run", "crit"] };
const LOOP_STALE_MIN = 20;
const f1 = (n) => n.toFixed(1), g1 = (n) => String(+n.toFixed(1));
const clampPct = (n) => Math.max(0, Math.min(100, n));
const localTime = (t) => new Date(t).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
const localDay = (t) => new Date(t).toLocaleDateString([], { year: "numeric", month: "short", day: "numeric" });
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

function loopPace(p, gp, now) {
  const used = clampPct(p.used_pct), ahead = Math.abs(p.under_line_points);
  const verdict = p.ahead ? `${f1(ahead)} points ahead` : `${f1(ahead)} points under`;
  const cls = p.ahead ? "warn" : "good";
  const src = p.source === "live" ? "Live reading" : p.source === "guard" ? "The guard's reading" : `Reading: ${esc(p.source)}`;
  const gp2 = gp && (!p || gp.used_pct !== p.used_pct) ? `<div class="sub">Guard's reading: ${g1(gp.used_pct)}% at ${esc(localTime(gp.at))}</div>` : "";
  return `<div class="meter"><div class="row"><span>Weekly pace</span><span class="big">${used.toFixed(0)}%</span></div>
    <div class="bar" role="img" aria-label="${used.toFixed(0)}% of the week's allowance used, pace line ${f1(p.line_pct)}%, stop ${g1(p.stop_pct)}%"><div class="fill" style="width:${used}%"></div><div class="tick" style="left:calc(${clampPct(p.line_pct)}% - 1px)"></div><div class="tick stop" style="left:calc(${clampPct(p.stop_pct)}% - 1px)"></div></div>
    <div class="sub">${g1(p.used_pct)}% used, pace line ${f1(p.line_pct)}% (${g1(p.stop_pct)}% stop × ${p.elapsed_pct.toFixed(0)}% of week gone): <span class="pace ${cls}">${verdict}</span></div>
    <div class="sub">${src} at ${esc(localTime(p.at))}</div>${gp2}
    <div class="key"><span><span class="sw" style="background:var(--used)"></span>Used</span><span><span class="sw line"></span>Pace line</span><span><span class="sw" style="background:var(--crit)"></span>Stop</span></div></div>`;
}

// Two figures (Adam, 2026-11-24: "Loop spend is shown as higher than all usage"). The estimate is what the loop has
// used: its runs' own calls priced from tokens, improve runs, and the scheduled jobs for the share of the week gone.
// The guard's booked figure is a safe upper bound, not spend: a margin on every run, never above the account reading
// (which holds all your use), plus the jobs' whole week up front. Both are % of the weekly allowance.
function loopSpend(l, pace) {
  const est = l.estimated_points, booked = l.used_points, cap = l.cap_points;
  const acct = pace ? `; the whole account has used ${g1(pace.used_pct)}%` : "";
  const guardLine = `<div class="sub">The guard books ≈${f1(booked)}% against the ${g1(cap)}% share (evals ${f1(l.eval_committed_points ?? l.eval_spent_points)} incl. ${f1(l.eval_pending_points)} pending, scheduled jobs' whole week ${f1(l.loop_jobs_points)}): a safety margin on every run, never more than the account meter, so room ≈${f1(l.room_points)}%.</div>`;
  if (est == null) {
    const pct = cap > 0 ? clampPct((booked / cap) * 100) : booked > 0 ? 100 : 0;
    return `<div class="meter"><div class="row"><span>Loop share booked</span><span class="big">≈${f1(booked)}%</span></div>
    <div class="bar" role="img" aria-label="Approximately ${f1(booked)}% of the week booked of the loop's ${g1(cap)}% share"><div class="fill" style="width:${pct}%"></div></div>
    ${guardLine}<div class="sub">% of the weekly allowance. Project threads are not counted.</div></div>`;
  }
  const pct = cap > 0 ? clampPct((est / cap) * 100) : est > 0 ? 100 : 0;
  return `<div class="meter"><div class="row"><span>Loop spend</span><span class="big">≈${f1(est)}%</span></div>
    <div class="bar" role="img" aria-label="Approximately ${f1(est)}% of the week used by the loop, of its ${g1(cap)}% share"><div class="fill" style="width:${pct}%"></div></div>
    <div class="sub">≈${f1(est)}% of the week used since the weekly reset, of the loop's ${g1(cap)}% share (eval runs ${f1(l.eval_estimated_points)}, improve runs ${f1(l.improve_estimated_points)}, scheduled jobs so far ${f1(l.loop_jobs_so_far_points)})${acct}.</div>
    ${guardLine}<div class="sub">% of the weekly allowance, estimated from token counts. Project threads are not counted.</div></div>`;
}

// The eval capacity is the guard's pace hold replayed over recent weeks of real use: evals run whenever other use is
// under the pace line (early in the week, after a quiet night), even in a week whose total passes the stop.
function replayNote(r) {
  if (!r) return "";
  const weeks = r.weeks === 1 ? "1 week" : `${r.weeks} weeks`;
  const range = r.low_points === r.high_points ? `≈${f1(r.low_points)}` : `≈${f1(r.low_points)} to ${f1(r.high_points)}`;
  const half = r.half_spent_by_hours == null ? "" : ` Evals get half of it within about ${Math.round(r.half_spent_by_hours)} hours of the weekly reset.`;
  return `<div class="sub">Eval capacity replays the pace hold over your last ${weeks} of real use: ${range} points a week, where a flat weekly average would give ≈${f1(r.flat_points)}.${half}</div>`;
}

// The catch-up arithmetic, step by step, from the forecast's own numbers (loop_status.py `calculation`).
const CAP_BASIS = { pace_replay: "the pace hold replayed over recent weeks of your real use", evals_first: "evals running first after the reset",
  stop_less_other: "the account stop less your other use", none: "no account stop applied" };
function calcSteps(c) {
  if (!c) return "";
  const p = (v) => v == null ? "?" : f1(v);
  const rows = c.subjects.map((r) => `<tr><td>${esc(r.subject)}</td><td>${esc(r.kind)}</td><td>${esc(r.route || "")}</td><td>${r.open_cells == null ? "" : esc(r.open_cells)}</td><td>${r.pairs == null ? "" : g1(r.pairs)}</td><td>${p(r.points)}</td></tr>`).join("");
  const more = c.subjects_total > c.subjects.length ? `<div class="sub">${c.subjects_total - c.subjects.length} more not listed.</div>` : "";
  const keep = c.keep_up_items.length ? c.keep_up_items.map((i) => `${esc(i.item)} ${p(i.points)}`).join(" + ") + " = " : "";
  let basis = hasOwn(CAP_BASIS, c.capacity_basis) ? CAP_BASIS[c.capacity_basis] : "the account stop";
  if (c.account_stop_points != null) basis = basis.replace("the account stop", `the ${g1(c.account_stop_points)}% stop`);
  // Show the subtraction only when it is the one the forecast made (loop jobs in the cap, floored at 0).
  const lessJobs = c.loop_jobs_points == null || c.weekly_cap_points == null || c.after_loop_jobs_points == null
    || Math.abs(Math.max(0, c.weekly_cap_points - c.loop_jobs_points) - c.after_loop_jobs_points) > 0.05 ? ""
    : ` − loop jobs <b>${p(c.loop_jobs_points)}</b> = <b>${p(c.after_loop_jobs_points)}</b>` + (c.weekly_cap_points < c.loop_jobs_points ? " (floored at 0)" : "");
  const weeks = c.backlog_points.central != null && c.backlog_points.central <= 0 ? "nothing to clear: 0 weeks."
    : c.room_points == null || c.room_points <= 0
    ? `Room is ${p(c.room_points)} points a week, so the backlog never clears at this capacity.`
    : `<b>${p(c.backlog_points.central)}</b> ÷ <b>${p(c.room_points)}</b> = <b>${c.weeks_central == null ? "?" : f1(c.weeks_central)} weeks</b>` +
      (c.start ? ` from ${esc(localTime(c.start))}` : "") + ".";
  return `<details class="calc"><summary>How the catch-up is worked out</summary><ol>
    <li>Open subjects: <b>${esc(c.subjects_total)}</b>, each still needing eval pairs before its keep or remove test decides. Points are each subject's pairs at the measured cost (≈$${p(c.usd_per_point)} a point).<div class="scroll"><table><tr><th>Subject</th><th>Kind</th><th>Route</th><th>Cells</th><th>Pairs</th><th>Points</th></tr>${rows}</table></div>${more}</li>
    <li>Backlog: the subjects add to <b>≈${p(c.backlog_points.central)} points</b> (${p(c.backlog_points.low)} to ${p(c.backlog_points.high)})${c.backlog_pairs == null ? "" : `, ${g1(c.backlog_pairs)} pairs`}.</li>
    <li>Eval capacity: weekly cap <b>${p(c.weekly_cap_points)}</b>${lessJobs}, then ${esc(basis)}: <b>${p(c.capacity_points)} points a week</b>.</li>
    <li>Keep-up, new work each week: ${keep}<b>${p(c.keep_up_points)} points a week</b>.</li>
    <li>Room for the backlog: <b>${p(c.capacity_points)}</b> − <b>${p(c.keep_up_points)}</b> = <b>${p(c.room_points)} points a week</b>.</li>
    <li>Catch-up: ${weeks}</li></ol></details>`;
}

function loopForecast(f, error) {
  let body = "";
  if (f) {
    const c = f.catch_up_date || {};
    const catchUp = c.central == null ? "Not at current capacity"
      : `${esc(localDay(c.central))}` + (c.fast != null && c.slow != null ? ` (${esc(localDay(c.fast))} to ${esc(localDay(c.slow))})` : "");
    const rows = (f.tasks || []).map((t) => `<tr><td>${esc(t.task)}</td><td>${f1(t.points_per_week)}</td></tr>`).join("");
    const tasks = rows ? `<div class="scroll"><table><tr><th>Task</th><th>Points per week</th></tr>${rows}</table></div>`
      : `<div class="sub">Per-task points: see the project dashboard's routines table.</div>`;
    body = `<div class="row"><span>Catch-up</span><span class="big">${catchUp}</span></div>
      <div class="sub">Keep-up ≈${f1(f.keep_up_points_per_week)} points/week · eval capacity ≈${f1(f.capacity_points_per_week)} points/week · non-eval use ≈${f1(f.non_eval_points_per_week)} points/week · open subjects ${esc(f.open_subjects)}</div>
      ${replayNote(f.pace_replay)}${calcSteps(f.calculation)}${tasks}<div class="sub">Forecast as of ${esc(localTime(f.as_of))}</div>`;
  }
  const e = error ? `<div class="sub warn">▲ Forecast: ${esc(error)}</div>` : "";
  return body || e ? `<div class="sec"><h2>Forecast</h2>${body}${e}</div>` : "";
}

function loopCard(src, now) {
  const st = src.status;
  if (!st) return `<section class="card"><h2>Loop guards</h2>${srcNote(src)}</section>`;
  const g = st.guard, v = hasOwn(VERDICTS, g.verdict) ? VERDICTS[g.verdict] : ["Unknown", "crit"];
  const icon = v[1] === "good" ? "✓" : v[1] === "warn" ? "▲" : "●";
  let body = `<div class="meter"><div class="row"><span class="big ${v[1]}">${icon} ${v[0]}</span></div><div class="sub">${esc(g.why)}</div></div>`;
  if (st.pace) body += loopPace(st.pace, st.guard_pace, now);
  if (st.session) {
    const x = st.session;
    body += `<div class="sec"><div class="row"><span>5-hour stop</span><span>${x.stop_pct == null
      ? esc(x.plan ? `Off: the ${x.plan} plan has no 5-hour window` : "Off: no 5-hour window")
      : `Stop at ${g1(x.stop_pct)}%` + (x.hold ? ` · <span class="pace crit">Holding</span>` : "")}</span></div></div>`;
  }
  if (st.loop) body += loopSpend(st.loop, st.pace || st.guard_pace);
  if (st.week && st.week.resets_at) {
    const left = new Date(st.week.resets_at).getTime() - now;
    body += `<div class="sec"><div class="row"><span>Next weekly reset</span><span>${esc(localTime(st.week.resets_at))} · ${left > 0 ? "in " + dur(left) : "just reset"}</span></div></div>`;
  }
  body += loopForecast(st.forecast, st.forecast_error);
  const age = now - new Date(st.computed_at).getTime(), stale = age > LOOP_STALE_MIN * 60000;
  body += `<div class="sub ${stale ? "warn" : ""}" style="margin-top:10px">${stale ? "▲ " : ""}Computed ${dur(age)} ago</div>`;
  return `<section class="card"><h2>Loop guards</h2>${srcNote(src)}${body}</section>`;
}

// A render failure must not leave a blank page: drop the data and show an error state.
function show() {
  try { render(); return true; }

    data = null; err = "Could not display the data: " + (e && e.message);
    try { render(); } catch { $("#app").textContent = err; }
    return false;

      ? `This link points at the same data source (<code>${esc(idOf(choice))}</code>) as the one saved on this device, but with a different key.`
      : `This link points at a different data source (<code>${esc(idOf(choice))}</code>) than the one saved on this device (<code>${esc(idOf(saved()))}</code>).`} Only use the new link if you trust where it came from.</p><div class="row"><button id="keep">Keep the saved one</button><button id="adopt">Use the new link</button></div></section>`;

  const age = now - new Date(data.generated_at).getTime(), stale = age > STALE_MIN * 60000;
  $("#updated").textContent = `Collected ${dur(age)} ago` + (data.host ? ` on ${data.host}` : "");

const isDemo = () => location.hash === "#demo";
// A reference is "<gist id>" (legacy, plaintext data) or "<gist id>.<key>" (encrypted data); the key never leaves the URL fragment.
const REF = /^([0-9a-f]{20,40})(?:\.([A-Za-z0-9_-]{43}))?$/i;
const fragId = () => { const h = location.hash.slice(1); return REF.test(h) ? h : null; };
const idOf = (ref) => String(ref).split(".")[0];
// localStorage on *.github.io is shared with the account's other Pages sites: trust nothing in it.
function saved() { try { const v = localStorage.getItem("gist"); return REF.test(v) ? v : null; } catch { return null; } }
const gistId = () => fragId() || saved();

// Decrypts the gist file text. A key demands encrypted data and no key demands plaintext: no downgrade.
// Reads a response body as text, refusing anything over max bytes: by the content-length header when there is
// one, and while reading, since the header can be absent or wrong. The download stops at the limit.
async function readText(r, max) {
  const tooBig = () => new Error("usage.json is missing or too large");
  const len = Number(r.headers && r.headers.get && r.headers.get("content-length"));
  if (len > max) throw tooBig();
  if (!r.body || !r.body.getReader) { const t = await r.text(); if (t.length > max) throw tooBig(); return t; }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let bytes = 0, text = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) return text + dec.decode();
    bytes += value.length;
    if (bytes > max) { await reader.cancel(); throw tooBig(); }
    text += dec.decode(value, { stream: true });
  }
}
const parseJson = (t, what = "usage.json") => { try { return JSON.parse(t); } catch { throw new Error(what + " is not valid JSON"); } };
async function open(text, key) {
  if (typeof text !== "string" || text.length > MAX_TEXT) throw new Error("usage.json is missing or too large");
  const doc = parseJson(text);
  const enc = doc !== null && typeof doc === "object" && doc.v === 1 && doc.enc === "A256GCM";
  if (!key) {
    if (enc) throw new Error("This data is encrypted. Open the full link Install.ps1 printed (it ends with .<key>).");
    return validateUsage(doc);
  }
  if (!enc) throw new Error("Expected encrypted data but the gist is not encrypted.");
  let plain;
  try {
    // iv and ct come from the gist: check their shape before decoding. The key was shape-checked by REF.
    const b64 = (s) => { if (typeof s !== "string" || !/^[A-Za-z0-9_-]+$/.test(s)) throw 0; return Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)); };
    const iv = b64(doc.iv);
    if (iv.length !== 12) throw 0;
    const k = await crypto.subtle.importKey("raw", b64(key), "AES-GCM", false, ["decrypt"]);
    plain = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, k, b64(doc.ct)));
  } catch { throw new Error("Could not decrypt usage.json: the link's key does not match."); }
  return validateUsage(parseJson(plain));
}

// Reject, never coerce: the page renders only a document that passed this.
function validateUsage(doc) {
  const bad = (p) => { throw new Error("usage.json is malformed: " + p); };
  const obj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
  const num = (v) => typeof v === "number" && isFinite(v) && Math.abs(v) <= MAX_NUM; // bounded, so sums stay finite
  const str = (v) => typeof v === "string" && v.length <= MAX_STR;
  const errText = (v) => typeof v === "string" && v.length <= MAX_ERR;
  const when = (v) => str(v) && isFinite(Date.parse(v));
  // Bounded against this device's clock, never against the document's own claims:
  // generated_at within 5 years back and 1 day ahead; row dates are real calendar days
  // inside the chart's MAX_DAYS window (ending tomorrow, to allow clock skew).
  const now = Date.now(), today = Math.floor(now / DAY) * DAY;
  const clock = " is far from this device's date; the device clock may be wrong";
  const need = (ok, p) => { if (!ok) bad(p); };
  const recent = (v, p) => { need(when(v), p); need(Date.parse(v) >= now - 5 * 365 * DAY && Date.parse(v) <= now + DAY, p + clock); };
  const day = (v, p) => {
    need(str(v) && /^\d{4}-\d{2}-\d{2}$/.test(v), p);
    const t = Date.parse(v + "T00:00:00Z");
    need(isFinite(t) && new Date(t).toISOString().slice(0, 10) === v, p); // 2026-02-31 is not a day
    need(t >= today - (MAX_DAYS - 2) * DAY && t <= today + DAY, p + clock);
  };
  const opt = (v, ok, p) => { if (v != null) need(ok(v), p); };
  const list = (v, p, max, row) => { if (v == null) return; need(Array.isArray(v) && v.length <= max, p); v.forEach((x, i) => { need(obj(x), `${p}[${i}]`); row(x, `${p}[${i}]`); }); };
  need(obj(doc), "(document)");
  recent(doc.generated_at, "generated_at");
  opt(doc.host, str, "host");
  need(obj(doc.sources), "sources");
  const src = (name, body) => {
    const s = doc.sources[name], p = "sources." + name;
    if (s == null) return;
    need(obj(s), p);
    need(typeof s.ok === "boolean", p + ".ok");
    opt(s.error, errText, p + ".error");
    opt(s.fetched_at, when, p + ".fetched_at");
    body(s, p);
  };
  for (const name of ["claude", "codex"]) src(name, (s, p) => {
    opt(s.plan, str, p + ".plan");
    list(s.windows, p + ".windows", MAX_WINDOWS, (w, q) => {
      need(str(w.label), q + ".label");
      need(num(w.used_pct), q + ".used_pct");
      opt(w.resets_at, when, q + ".resets_at");
      need(num(w.period_seconds) && w.period_seconds > 0, q + ".period_seconds");
      opt(w.paced_from, when, q + ".paced_from");
    });
    // Optional: older documents lack it. Codename limits shown for information; they have no period.
    list(s.other, p + ".other", MAX_OTHER, (o, q) => {
      need(str(o.id), q + ".id");
      need(str(o.label), q + ".label");
      need(num(o.used_pct), q + ".used_pct");
      opt(o.resets_at, when, q + ".resets_at");
      for (const f of ["limit_usd", "used_usd", "remaining_usd"]) opt(o[f], num, q + "." + f);
      opt(o.locked_reason, str, q + ".locked_reason");
    });
  });
  src("platform", (s, p) => {
    const models = new Set();
    list(s.usage, p + ".usage", MAX_ROWS, (r, q) => {
      day(r.date, q + ".date");
      need(str(r.model), q + ".model"); models.add(r.model);
      for (const k of ["input", "cache_write", "cache_read", "output"]) need(num(r[k]) && r[k] >= 0, `${q}.${k}`);
    });
    list(s.costs, p + ".costs", MAX_ROWS, (c, q) => {
      day(c.date, q + ".date");
      need(str(c.model), q + ".model"); models.add(c.model);
      need(num(c.usd) && c.usd >= 0, q + ".usd");
    });
    need(models.size <= MAX_MODELS, p + ".models");
  });
  src("loop", (s, p) => {
    if (s.status == null) return;
    const st = s.status, q = p + ".status";
    need(obj(st) && st.schema === 1, q + ".schema");
    need(when(st.computed_at), q + ".computed_at");
    const n = (v, r) => need(num(v), q + "." + r), nn = (v, r) => { if (v != null) n(v, r); };
    need(obj(st.guard) && typeof st.guard.verdict === "string" && st.guard.verdict.length <= 40 && errText(st.guard.why), q + ".guard");
    if (st.week != null) { need(obj(st.week), q + ".week"); opt(st.week.window_start, when, q + ".week.window_start"); opt(st.week.resets_at, when, q + ".week.resets_at"); }
    if (st.session != null) {
      need(obj(st.session), q + ".session");
      opt(st.session.plan, str, q + ".session.plan"); nn(st.session.stop_pct, "session.stop_pct");
    }
    for (const k of ["pace", "guard_pace"]) {
      const x = st[k]; if (x == null) continue;
      need(obj(x) && str(x.source) && when(x.at) && typeof x.ahead === "boolean", `${q}.${k}`);
      for (const f of ["used_pct", "elapsed_pct", "line_pct", "stop_pct", "under_line_points"]) n(x[f], `${k}.${f}`);
    }
    if (st.loop != null) {
      need(obj(st.loop), q + ".loop");
      for (const f of ["eval_spent_points", "eval_pending_points", "loop_jobs_points", "used_points", "cap_points", "room_points"]) n(st.loop[f], "loop." + f);
      for (const f of ["eval_committed_points", "estimated_points", "eval_estimated_points", "improve_estimated_points", "loop_jobs_so_far_points"]) nn(st.loop[f], "loop." + f);
      if (st.loop.estimated_points != null) for (const f of ["eval_estimated_points", "improve_estimated_points", "loop_jobs_so_far_points"]) n(st.loop[f], "loop." + f);
    }
    if (st.forecast != null) {
      const f = st.forecast;
      need(obj(f) && when(f.as_of), q + ".forecast");
      for (const k of ["keep_up_points_per_week", "capacity_points_per_week", "non_eval_points_per_week"]) n(f[k], "forecast." + k);
      need(num(f.open_subjects) && f.open_subjects >= 0, q + ".forecast.open_subjects");
      if (f.catch_up_date != null) { need(obj(f.catch_up_date), q + ".forecast.catch_up_date"); for (const k of ["central", "fast", "slow"]) opt(f.catch_up_date[k], when, `${q}.forecast.catch_up_date.${k}`); }
      if (f.calculation != null) {
        const c = f.calculation, r = q + ".forecast.calculation";
        need(obj(c) && num(c.subjects_total) && c.subjects_total >= 0 && obj(c.backlog_points), r);
        for (const k of ["central", "low", "high"]) opt(c.backlog_points[k], num, `${r}.backlog_points.${k}`);
        for (const k of ["backlog_pairs", "usd_per_point", "account_stop_points", "weekly_cap_points", "loop_jobs_points", "after_loop_jobs_points", "capacity_points", "keep_up_points", "room_points", "weeks_central"]) opt(c[k], num, `${r}.${k}`);
        opt(c.capacity_basis, str, r + ".capacity_basis");
        opt(c.start, when, r + ".start");
        need(Array.isArray(c.subjects) && Array.isArray(c.keep_up_items), r);
        list(c.subjects, r + ".subjects", 60, (x, y) => { need(str(x.subject) && str(x.kind), y); opt(x.route, str, y + ".route"); for (const k of ["open_cells", "pairs", "points"]) opt(x[k], num, `${y}.${k}`); });
        list(c.keep_up_items, r + ".keep_up_items", 20, (x, y) => { need(str(x.item), y + ".item"); opt(x.points, num, y + ".points"); });
      }
      if (f.pace_replay != null) {
        const r = f.pace_replay;
        need(obj(r) && num(r.weeks) && r.weeks >= 0, q + ".forecast.pace_replay");
        for (const k of ["low_points", "high_points", "flat_points"]) n(r[k], "forecast.pace_replay." + k);
        opt(r.half_spent_by_hours, num, q + ".forecast.pace_replay.half_spent_by_hours");
      }
      list(f.tasks, q + ".forecast.tasks", 50, (t, r) => { need(str(t.task), r + ".task"); need(num(t.points_per_week), r + ".points_per_week"); });
    }
    opt(st.forecast_error, errText, q + ".forecast_error");
  });
  return doc;
}

          { kind: "skill", subject: "sample-skill", route: "remove-or-cap", open_cells: 1, pairs: 20, points: 2.4 }], subjects_total: 21,
          backlog_points: { central: 26, low: 18, high: 61 }, backlog_pairs: 160, usd_per_point: 15.6, weekly_cap_points: 25, loop_jobs_points: 8.9,
          after_loop_jobs_points: 16.1, capacity_points: 6.3, capacity_basis: "pace_replay", account_stop_points: 80, keep_up_items: [{ item: "new guidance sections", points: 1.2 }],

}

// Another gist is about to be shown: nothing of the previous one (or of #demo) may linger on screen.
function switchTo(ref) {
  lastRef = ref; data = null; err = null;
  $("#app").innerHTML = "";
  $("#updated").textContent = "Loading…";
}

// Each call supersedes earlier ones: a response that arrives after a newer load began is dropped.
async function load(adopt) {
  const my = ++seq;
  choice = null;
  $("#refresh").disabled = false;
  if (isDemo()) { switchTo("#demo"); data = validateUsage(demo()); err = null; return show(); }
  // A fragment is only a candidate: it is saved after its gist loaded, validated and rendered.
  const frag = fragId(), old = saved();
  if (frag && adopt === frag) adopted = frag; // the user's choice sticks, so a later timed load does not re-ask
  if (frag && old && frag !== old && adopted !== frag) { choice = frag; return show(); }
  const ref = frag || old;
  if (ref !== lastRef) switchTo(ref);
  if (!ref) return show();
  const [id, key] = ref.split(".");
  $("#refresh").disabled = true;
  let ok = false;
  try {
    const r = await fetch("https://api.github.com/gists/" + id, { cache: "no-store", headers: { Accept: "application/vnd.github+json" } });
    if (my !== seq) return;
    if (!r.ok) throw new Error(r.status === 403 ? "GitHub rate limit reached; try again in a few minutes" : "GitHub returned " + r.status);
    const body = parseJson(await readText(r, MAX_API), "The GitHub response");
    if (my !== seq) return;
    const f = body && body.files && body.files["usage.json"];
    if (!f) throw new Error("usage.json is not in the gist yet");
    let text = f.content;
    if (f.truncated) {
      if (typeof f.raw_url !== "string" || !f.raw_url.startsWith("https://gist.githubusercontent.com/")) throw new Error("usage.json has no usable download link");
      const rr = await fetch(f.raw_url, { cache: "no-store" });
      if (!rr.ok) throw new Error("GitHub returned " + rr.status);
      text = await readText(rr, MAX_TEXT);
    }
    const doc = await open(text, key);
    if (my !== seq) return; // a newer load began while this one was reading or decrypting
    data = doc; err = null; ok = true;
  } catch (e) { if (my !== seq) return; err = e.message; }
  $("#refresh").disabled = false;
  // Save only after the page has actually rendered this gist.
  if (show() && ok && frag && frag !== old) try { localStorage.setItem("gist", frag); } catch {}
}

$("#refresh").addEventListener("click", load);
addEventListener("hashchange", load);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 120000);   // re-read the gist every 2 min
setInterval(() => { if (!document.hidden && data) show(); }, 30000); // keep elapsed time moving
load();
</script>
