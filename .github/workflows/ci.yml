name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect salient changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$PUSH_BASE"
          head="$PUSH_HEAD"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          fi
          run=true
          if [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]] &&
             git cat-file -e "$base^{commit}" 2>/dev/null &&
             git cat-file -e "$head^{commit}" 2>/dev/null; then
            if git diff --no-renames --name-only -z "$base" "$head" > "$RUNNER_TEMP/changed-paths"; then
              run=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  index.html|tests/*|collector/AiUsage.psm1|.github/workflows/ci.yml|.github/workflows/actions.lock) run=true; break ;;
                esac
              done < "$RUNNER_TEMP/changed-paths"
            fi
          fi
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"
      - name: No salient changes
        if: steps.changes.outputs.run != 'true'
        run: echo 'No relevant changes; required check succeeds.'
      - uses: actions/setup-node@v7.0.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '24'
      - name: Run tests
        if: steps.changes.outputs.run == 'true'
        run: node --test tests/*.test.mjs

  pester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect salient changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$PUSH_BASE"
          head="$PUSH_HEAD"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          fi
          run=true
          if [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]] &&
             git cat-file -e "$base^{commit}" 2>/dev/null &&
             git cat-file -e "$head^{commit}" 2>/dev/null; then
            if git diff --no-renames --name-only -z "$base" "$head" > "$RUNNER_TEMP/changed-paths"; then
              run=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  collector/AiUsage.psm1|collector/tests/*|.github/workflows/*|.github/actions/*) run=true; break ;;
                esac
              done < "$RUNNER_TEMP/changed-paths"
            fi
          fi
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"
      - name: No salient changes
        if: steps.changes.outputs.run != 'true'
        run: echo 'No relevant changes; required check succeeds.'
      - name: Verify action lockfile
        if: steps.changes.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ext="$RUNNER_TEMP/gh-actions-lock"
          mkdir -p "$ext"
          gh release download v0.2.0 -R github/gh-actions-lock -p linux-amd64 -O "$ext/gh-actions-lock"
          echo "79ec84c191667fd935a277e6fd3662cf5d3669cccc9e99998731d8f306f373b6  $ext/gh-actions-lock" | sha256sum -c -
          chmod +x "$ext/gh-actions-lock"
          (cd "$ext" && gh extension install .)
          rc=0
          out=$(gh actions-lock --verify --no-interactive --json=valid,findings) || rc=$?
          # v0.2.0 exits 0 with a reachability-unknown finding when the API fails; fail on any finding.
          if [[ "$rc" -ne 0 ]] || ! jq -e '.valid == true and (.findings | length) == 0' <<<"$out" >/dev/null; then
            # Escape %, CR and LF so finding text cannot start a new workflow command.
            jq -r 'def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A"); .findings[]? | "::error::actions.lock \(.category | esc): \(.dependency // .workflow // "-" | esc): \(.detail | esc)"' <<<"$out" || echo '::error::gh actions-lock --verify returned no readable JSON.'
            if jq -e 'any(.findings[]?; .category == "reachability-unknown")' <<<"$out" >/dev/null 2>&1; then
              echo '::error::reachability-unknown means the GitHub API was unreachable; re-run once it is back.'
            fi
            echo "::error::gh actions-lock --verify failed (exit $rc)."
            exit 1
          fi
      - name: Install YAML parser
        if: steps.changes.outputs.run == 'true'
        shell: pwsh
        run: Install-Module -Name powershell-yaml -RequiredVersion 0.4.12 -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop
      - name: Run tests
        if: steps.changes.outputs.run == 'true'
        run: pwsh -NoProfile -File collector/tests/Run-Tests.ps1
