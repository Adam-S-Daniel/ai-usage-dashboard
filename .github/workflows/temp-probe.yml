name: TEMP lockfile probe
on: pull_request
permissions:
  contents: read
jobs:
  reusable:
    uses: actions/reusable-workflows/.github/workflows/check-dist.yml@main
  composite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/temp-probe
